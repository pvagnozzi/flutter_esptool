# Analysis options for esptool_cli example.
#
# Extends Flutter lints for the CLI application.

include: package:flutter_lints/flutter.yaml

linter:
  rules:
    - always_use_package_imports
    - directives_ordering
    - prefer_single_quotes
    - avoid_print
    - cancel_subscriptions
    - prefer_final_locals
    - unnecessary_lambdas
